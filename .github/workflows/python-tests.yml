name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s python/tests -v
      - run: python python/examples/demo_finite_depth.py --no-plot --output "$RUNNER_TEMP/finite_depth"
      - run: python python/examples/demo_fixed_baseline_bscan.py --no-plot --output "$RUNNER_TEMP/fixed_baseline"
